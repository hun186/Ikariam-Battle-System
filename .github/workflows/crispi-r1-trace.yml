name: Crispi R1 model trace

on:
  push:
    branches:
      - main
      - research/crispi-r1-position-gap-matrix
      - research/crispi-r1-event-source-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source and pinned fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Full suite with research regression
        run: python -m pytest -q
      - name: Generate case evidence trace
        run: |
          PYTHONPATH=. python tools/research/crispi_round1_damage_trace.py --output research-output/crispi_r1_current_trace.json
      - name: Preserve trace artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crispi-r1-current-model-trace
          path: research-output/crispi_r1_current_trace.json
          if-no-files-found: error
