name: Crispi R1 model trace

on:
  push:
    branches:
      - research/crispi-r1-event-source-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source and pinned fixtures
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Full suite with research regression
        run: python -m pytest -q
      - name: Generate case evidence trace
        run: |
          PYTHONPATH=. python tools/research/crispi_round1_damage_trace.py --output research-output/crispi_r1_current_trace.json
      - name: Preserve trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispi-r1-current-model-trace
          path: research-output/crispi_r1_current_trace.json
          if-no-files-found: error
