name: P0 Naval Evidence Gap Audit

on:
  push:
    branches:
      - research/p0-naval-evidence-gap-matrix-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naval-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run evidence-class audit and related probes
        run: |
          python -m pytest -q tests/unit/test_p0_naval_observed_vs_model.py tests/unit/test_naval_fast_carrier_experimental_engine.py tests/unit/test_naval_ram_empirical_probe.py
      - name: Export source-tagged controlled comparison JSON and CSV
        run: |
          PYTHONPATH=. python tools/research/p0_naval_observed_vs_model.py --output-json research-output/p0_naval_evidence_gap.json --output-csv research-output/p0_naval_evidence_gap.csv
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Compile packages
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Upload reproducible aggregate and missing-evidence ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-naval-observation-model-evidence-gap
          path: |
            research-output/p0_naval_evidence_gap.json
            research-output/p0_naval_evidence_gap.csv
          if-no-files-found: error
