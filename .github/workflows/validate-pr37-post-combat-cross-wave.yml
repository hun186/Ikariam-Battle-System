name: Validate PR37 post-combat cross-wave guard

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-post-combat-cross-wave.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate post-combat cross-wave boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.engine import simulate
          result=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':3,
              'attacker':{'units':[
                  {'unit_id':'hoplite','quantity':90,'attack_upgrade':200}]},
              'defender':{'units':[
                  {'unit_id':'steam_giant','quantity':30,'entry_batch_id':'d0','wave_id':'d-first'},
                  {'unit_id':'steam_giant','quantity':10,'entry_batch_id':'d0','wave_id':'d-reserve'},
              ]},
          })
          assert result['status']=='inconclusive'
          assert result['outcome']=='inconclusive'
          assert result['rounds_completed']==1
          assert result['casualties']['defender'].get('steam_giant')==30
          boundary=[e for e in result['events']
                    if e['type']=='unsupported_mechanic'
                    and e['details'].get('rule_id')=='UNKNOWN-CROSS-WAVE-FORMATION-REBUILD']
          assert boundary and boundary[-1]['round']==1 and boundary[-1]['phase']=='round_end'
          assert boundary[-1]['side']=='defender'
          assert any(r['wave_id']=='d-reserve' and r['runtime_line']=='first'
                     for r in boundary[-1]['details']['requirements'])
          assert not any(e['type']=='battle_termination' and e['round']==1
                         for e in result['events'])
          assert result['final_state']['defender']['reserve']['steam_giant']==10
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-post-combat-cross-wave.yml
          git commit -m "chore: remove PR37 post-combat validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
