name: Validate mechanics spec sync

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-mechanics-spec-sync.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate public mechanics register and suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/unit/test_profiles.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path

          spec=Path('docs/mechanics-spec.md').read_text()
          required=(
              'EXP-D-KILL-SEQUENTIAL-001',
              'EXP-SLOT-DAMAGE-EVEN-001',
              'EXP-IR-DISABLED-001',
              'EXP-SR-DISABLED-001',
              'Individual shots re-evaluate the highest surviving target formation',
              'Artillery therefore never silently attacks Long-range, Artillery, or Air',
              'Machine land units are Steam Giant, Battering Ram, Catapult, Mortar, Gyrocopter, and Bombardier',
              'Formation firing chronology and class-level target transfer after destruction are no longer listed as unknowns',
          )
          for needle in required:
              assert needle in spec, needle

          forbidden=(
              'Experimental targeting uses versioned priorities and `EXP-TARGET-LEGACY-001`',
              'Named policies include pooled I-kill',
              'no within-phase retarget',
              'Remaining unknowns include kill selection, rounding selector, SR/IR triggers, complete chronology, target transfer after destruction',
          )
          for needle in forbidden:
              assert needle not in spec, needle

          # The obsolete IDs may only appear in the explicit superseded-history sentence.
          for obsolete in ('EXP-I-KILL-001','EXP-CHRONOLOGY-001','EXP-RETARGET-NONE-001','EXP-TARGET-LEGACY-001'):
              assert spec.count(obsolete)==1, (obsolete, spec.count(obsolete))

          html=Path('index.html').read_text()
          assert html==Path('public/index.html').read_text()
          Path('/tmp/ikariam-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mechanics-spec-sync.yml
          git commit -m "chore: remove mechanics-spec validation"
          git push origin HEAD:feat/round-combat-healing-stats
