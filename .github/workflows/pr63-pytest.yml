name: Ikariam battle full pytest

on:
  push:
    branches:
      - fix/wall-occupancy-round-boundary-flanks
      - research/wall-air-round1-reference-cases
      - research/crispi-r1-damage-trace
      - fix/round-wall-snapshot-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest -q (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pyproject.toml sets pytest pythonpath to repo root; custom backend is not PEP 660 editable.
          python -m pip install pytest
      - name: Run complete pytest suite
        run: python -m pytest -q
      - name: Export Crispi R1 diagnostic trace
        run: python -m tools.crispi_round1_trace > crispi-round1-trace.json
      - name: Upload Crispi R1 trace
        uses: actions/upload-artifact@v4
        with:
          name: crispi-round1-trace
          path: crispi-round1-trace.json
          retention-days: 30
