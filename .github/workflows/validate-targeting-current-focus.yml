name: Validate targeting current focus

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-targeting-current-focus.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate current-state docs and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_attacking_matrix.py tests/unit/test_engine.py tests/unit/test_profiles.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          memory=Path('.codex/memory.md').read_text()
          assert 'targeting and ignored accuracy are named experimental policies' not in memory
          assert 'Art of Warfare firing chronology and runtime-line target priorities are executable contracts' in memory
          assert 'ignored accuracy remains a named experimental policy' in memory

          html=Path('index.html').read_text()
          assert html==Path('public/index.html').read_text()
          Path('/tmp/ikariam-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-targeting-current-focus.yml
          git commit -m "chore: remove targeting-current-focus validation"
          git push origin HEAD:feat/round-combat-healing-stats
