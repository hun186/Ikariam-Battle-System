name: Verify unit icon integration

on:
  push:
    branches:
      - feat/land-unit-icons
    paths:
      - .github/workflows/verify-unit-icons.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
      - name: Test
        run: pytest -q
      - name: Verify mirrored UI and no runtime hotlink
        shell: bash
        run: |
          cmp index.html public/index.html
          ! grep -R "https://ika-sim.com/units/" index.html public/index.html
