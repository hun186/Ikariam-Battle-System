name: Validate Barbarian catalog

on:
  push:
    branches:
      - feat/barbarian-unit-catalog
    paths:
      - .github/workflows/validate-barbarian-catalog.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barbarian-unit-catalog
          fetch-depth: 0
      - name: Run repository validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q
          cmp index.html public/index.html
          test "$(find assets/unit-icons/barbarian -type f | wc -l)" -eq 9
          test "$(find public/assets/unit-icons/barbarian -type f | wc -l)" -eq 9
          test -f docs/barbarian-icon-provenance.md
          test -f docs/barbarian-unit-provenance.md
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-barbarian-catalog.yml
          git commit -m "chore: remove one-time Barbarian validation workflow"
          git push origin HEAD:feat/barbarian-unit-catalog
