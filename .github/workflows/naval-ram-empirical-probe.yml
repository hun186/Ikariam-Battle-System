name: Naval Ram / Barbarian Deckwrecker empirical probe

on:
  push:
    branches:
      - research/naval-ram-deckwrecker-empirical-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen experiment source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Full baseline and evidence-input tests
        run: python -m pytest -q
      - name: Execute separated current model probe
        run: |
          PYTHONPATH=. python tools/research/naval_ram_empirical_probe.py --output research-output/naval_ram_empirical_probe.json
      - name: Evaluate visible carrier HP against naval AM
        run: |
          PYTHONPATH=. python tools/research/naval_air_counterpart_probe.py --output research-output/naval_air_counterpart_probe.json
      - name: Compare PvP player speedboats against player carriers
        run: |
          PYTHONPATH=. python tools/research/naval_pvp_fast_carrier_probe.py --output research-output/naval_pvp_fast_carrier_probe.json
      - name: Preserve model event trace for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: naval-ram-vs-deckwrecker-controlled-probe
          path: |
            research-output/naval_ram_empirical_probe.json
            research-output/naval_air_counterpart_probe.json
            research-output/naval_pvp_fast_carrier_probe.json
          if-no-files-found: error
