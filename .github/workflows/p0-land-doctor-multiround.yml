name: P0 Land Doctor Cross-Round Regression

on:
  push:
    branches:
      - research/p0-land-doctor-multiround-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-doctor-rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run focused Doctor / low-HP / Tender cross-round tests
        run: |
          python -m pytest -q tests/unit/test_p0_land_doctor_multiround.py tests/unit/test_p0_low_hp_hp_ledger.py tests/unit/test_naval_tender_multiround_experimental.py
      - name: Run full pytest regression
        run: python -m pytest -q
      - name: Compile Python packages
        run: python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
