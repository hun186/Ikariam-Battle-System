name: Validate PR37 combined initial wait

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-combined-initial-wait.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate combined Round-0 wait
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.engine import simulate
          result=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':3,
              'attacker':{'units':[{'unit_id':'hoplite','quantity':90,'entry_batch_id':'a3','arrival_round':3}]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90,'entry_batch_id':'d3','arrival_round':3}]},
          })
          wait=next(e for e in result['events']
                    if e['type']=='waiting_for_arrival' and e['round']==0)
          assert wait['side'] is None
          assert wait['details']['pending_sides']==['attacker','defender']
          assert wait['details']['next_arrival_round']==3
          assert set(wait['details']['pending'])=={'attacker','defender'}
          assert not any(e['type']=='battle_termination' and e['round']==0
                         for e in result['events'])
          assert any(e['type']=='entry_batch_arrived' and e['round']==3
                     and e['side']=='attacker' for e in result['events'])
          assert any(e['type']=='entry_batch_arrived' and e['round']==3
                     and e['side']=='defender' for e in result['events'])
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-combined-initial-wait.yml
          git commit -m "chore: remove PR37 combined-wait validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
