name: Validate reached morale assumptions

on:
  push:
    branches:
      - feat/morale-status-reporting
    paths:
      - .github/workflows/validate-morale-reached-status.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/morale-status-reporting
          fetch-depth: 0
      - name: Validate reached morale status
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          from ikariam_battle import simulate

          blocked={
              'policy':'experimental',
              'battlefield':'land-mini',
              'max_rounds':2,
              'attacker':{'units':[
                  {'unit_id':'hoplite','quantity':30},
                  {'unit_id':'steam_giant','quantity':10},
                  {'unit_id':'cook','quantity':15},
              ]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':30}]},
          }
          result=simulate(blocked)
          rules={
              e['details'].get('rule_id')
              for e in result['events']
              if e['type']=='unsupported_mechanic'
          }
          assert {'UNKNOWN-MIXED-UNIT-AM-ROWS','UNKNOWN-MORALE-SUPPORT'} <= rules
          assert result['assumptions']==[]
          assert result['morale_status']['sides']['attacker']=={
              'cook_count':15,
              'status':'not_reached',
              'effect_applied':False,
          }

          reached={**blocked,'attacker':{'units':[
              {'unit_id':'hoplite','quantity':30},
              {'unit_id':'cook','quantity':15},
          ]}}
          reached_result=simulate(reached)
          assert 'EXP-MORALE-NONE-001' in {a['id'] for a in reached_result['assumptions']}
          assert reached_result['morale_status']['sides']['attacker']['status']=='ignored_by_named_assumption'

          html=Path('index.html').read_text()
          assert '尚未到達士氣處理' in html
          assert "not_reached:'尚未到達'" in html
          assert html==Path('public/index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ikariam-ui.js').write_text(script)
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-morale-reached-status.yml
          git commit -m "chore: remove one-time morale reached-status validation"
          git push origin HEAD:feat/morale-status-reporting
