name: Land Barbarian Round80-89 research evidence tests

on:
  push:
    branches:
      - research/land-barbarian-rounds80-89-observations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Verify 10 user-confirmed rounds and research provenance
        run: python -m pytest -q tests/unit/test_land_barbarian_rounds80_89_research.py
      - name: Check complete unaffected battle simulator regression suite
        run: python -m pytest -q
