name: Validate PR37 review fixes

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-review-fixes.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.models import Army, ScenarioError
          from ikariam_battle.engine import simulate

          try:
              Army.from_dict({'units':[
                  {'unit_id':'hoplite','quantity':10,'entry_batch_id':'a','wave_id':'same'},
                  {'unit_id':'hoplite','quantity':20,'entry_batch_id':'b','wave_id':'same'},
              ]})
          except ScenarioError as exc:
              assert 'cannot be reused across entry batches' in str(exc)
          else:
              raise AssertionError('ambiguous wave identity was not rejected')

          doctor=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':1,
              'attacker':{'units':[
                  {'unit_id':'hoplite','quantity':90,'entry_batch_id':'a0','arrival_round':0},
                  {'unit_id':'doctor','quantity':2,'entry_batch_id':'a1','arrival_round':1},
              ]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90}]},
          })
          assert 'EXP-HEAL-NONE-001' in {a['id'] for a in doctor['assumptions']}
          assert doctor['healing_status']['sides']['attacker']['status']=='ignored_by_named_assumption'

          cook=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':1,
              'attacker':{'units':[
                  {'unit_id':'hoplite','quantity':90,'entry_batch_id':'a0','arrival_round':0},
                  {'unit_id':'cook','quantity':15,'entry_batch_id':'a1','arrival_round':1},
              ]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90}]},
          })
          assert 'EXP-MORALE-NONE-001' in {a['id'] for a in cook['assumptions']}
          assert cook['morale_status']['sides']['attacker']['status']=='ignored_by_named_assumption'
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-review-fixes.yml
          git commit -m "chore: remove PR37 review validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
