name: Validate center-first round rebuild

on:
  push:
    branches:
      - fix/center-first-round-rebuild
    paths:
      - .github/workflows/validate-center-first-round-rebuild.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-first-round-rebuild
          fetch-depth: 0
      - name: Validate center-first rebuild and top simulate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for needle in (
              'id="simulateTop" class="primary" type="button">開始模擬</button>',
              'id="simulate" class="primary" type="button">開始模擬</button>',
              'async function runSimulation(){',
              "simulate.addEventListener('click',runSimulation)",
              "simulateTop.addEventListener('click',runSimulation)",
          ):
              assert needle in html, needle
          assert html.count('>開始模擬</button>') == 2
          tests=Path('tests/unit/test_formation.py').read_text()
          assert 'test_land_max_front_deploys_center_out_by_pdf_damage_priority' in tests
          assert 'test_round_start_repacks_same_wave_survivors_center_first_before_rr' in tests
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-center-first-round-rebuild.yml
          git commit -m "chore: remove center-first rebuild validation"
          git push origin HEAD:fix/center-first-round-rebuild
