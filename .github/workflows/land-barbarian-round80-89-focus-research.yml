name: Land Barbarian R80-89 AM focus research

on:
  push:
    branches:
      - research/land-barbarian-rounds80-89-observations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  land-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Verify complete baseline and Land research assertions
        run: python -m pytest -q
      - name: Export controlled AM address histograms versus user casualties
        run: |
          PYTHONPATH=. python tools/research/land_round80_89_am_focus_probe.py --output research-output/land_round80_89_am_focus_probe.json
      - name: Decompose knife/axe hit-to-kill and conditional wall one-row reroute
        run: |
          PYTHONPATH=. python tools/research/land_round80_89_two_class_am_probe.py --output research-output/land_round80_89_two_class_am_probe.json
      - name: Upload read-only inverse research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: land-barbarian-round80-89-am-address-inverse
          path: |
            research-output/land_round80_89_am_focus_probe.json
            research-output/land_round80_89_two_class_am_probe.json
          if-no-files-found: error
