name: Validate PR30 combat regression hardening

on:
  push:
    branches:
      - test/pr30-combat-regression-hardening
    paths:
      - .github/workflows/validate-pr30-combat-regressions.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/pr30-combat-regression-hardening
          fetch-depth: 0
      - name: Validate phase chronology and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert html==Path('public/index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ikariam-ui.js').write_text(script)
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr30-combat-regressions.yml
          git commit -m "chore: remove one-time combat regression validation"
          git push origin HEAD:test/pr30-combat-regression-hardening
