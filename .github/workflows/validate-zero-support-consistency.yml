name: Validate zero-support consistency

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-zero-support-consistency.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate final PR scope
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/unit/test_profiles.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          from ikariam_battle import simulate

          for support,status_key,count_key,assumption in (
              ('doctor','healing_status','doctor_count','EXP-HEAL-NONE-001'),
              ('cook','morale_status','cook_count','EXP-MORALE-NONE-001'),
          ):
              s={'policy':'experimental','battlefield':'land-mini','max_rounds':1,
                 'attacker':{'units':[{'unit_id':'hoplite','quantity':30},
                                      {'unit_id':support,'quantity':0}]},
                 'defender':{'units':[{'unit_id':'hoplite','quantity':30}]}}
              result=simulate(s)
              assert result[status_key]['sides']['attacker'][count_key]==0
              assert result[status_key]['sides']['attacker']['status']=='not_present'
              assert assumption not in {a['id'] for a in result['assumptions']}

          html=Path('index.html').read_text()
          assert html==Path('public/index.html').read_text()
          Path('/tmp/ikariam-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-zero-support-consistency.yml
          git commit -m "chore: remove zero-support validation"
          git push origin HEAD:feat/round-combat-healing-stats
