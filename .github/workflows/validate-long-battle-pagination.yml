name: Validate long battle pagination

on:
  push:
    branches:
      - feat/round-safety-cap-1000
    paths:
      - .github/workflows/validate-long-battle-pagination.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-safety-cap-1000
          fetch-depth: 0
      - name: Validate bounded transport and long battle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_models.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ikariam-ui.js').write_text(script)
          PY
          node --check /tmp/ikariam-ui.js
          python - <<'PY'
          import json
          from time import perf_counter
          from web_simulator import run_battle

          units=[
              {'unit_id':'hoplite','quantity':10_000_000},
              {'unit_id':'swordsman','quantity':10_000_000},
              {'unit_id':'archer','quantity':10_000_000},
              {'unit_id':'battering_ram','quantity':10_000_000},
              {'unit_id':'gyrocopter','quantity':10_000_000},
              {'unit_id':'bombardier','quantity':10_000_000},
          ]
          scenario={
              'policy':'experimental',
              'battlefield':'land-max',
              'max_rounds':300,
              'attacker':{'units':units},
              'defender':{'units':units},
          }

          started=perf_counter()
          summary=run_battle(scenario)
          summary_sec=perf_counter()-started
          summary_bytes=len(json.dumps(summary,separators=(',',':')).encode())

          started=perf_counter()
          page=run_battle({**scenario,'report':{'mode':'round_page','round_start':0,'round_limit':20}})
          page_sec=perf_counter()-started
          page_bytes=len(json.dumps(page,separators=(',',':')).encode())

          print(
              'LONG_BATTLE_TRANSPORT_BENCHMARK '
              f'rounds={summary["rounds_completed"]} '
              f'events_available={summary["report"]["events_available"]} '
              f'summary_bytes={summary_bytes} summary_sec={summary_sec:.3f} '
              f'page_bytes={page_bytes} page_sec={page_sec:.3f} '
              f'page_rounds={page["report"]["rounds_returned"]} '
              f'page_events={page["report"]["events_returned"]}'
          )

          assert summary['rounds_completed']==300
          assert summary['report']['mode']=='summary'
          assert summary['rounds']==[]
          assert summary_bytes < 1_000_000
          assert page['report']['mode']=='round_page'
          assert page['report']['round_start']==0
          assert page['report']['round_end']==19
          assert page['report']['rounds_returned']==20
          assert all(0 <= row['round'] <= 19 for row in page['rounds'])
          assert all(0 <= event['round'] <= 19 for event in page['events'])
          assert page_bytes < 4_000_000
          PY
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-long-battle-pagination.yml
          git commit -m "chore: remove one-time long-battle validation"
          git push origin HEAD:feat/round-safety-cap-1000
