name: Validate PR37 same-wave refill projection

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-same-wave-projection.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate same-wave refill projection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.engine import simulate
          result=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':2,
              'attacker':{'units':[{'unit_id':'hoplite','quantity':90,'attack_upgrade':200}]},
              'defender':{'units':[{'unit_id':'steam_giant','quantity':40,'entry_batch_id':'d0','wave_id':'d-first'}]},
          })
          assert not any(e['type']=='unsupported_mechanic' and e['round']==1
                         and e['details'].get('rule_id')=='UNKNOWN-CROSS-WAVE-FORMATION-REBUILD'
                         for e in result['events'])
          assert result['rounds'][1]['casualties']['defender'].get('steam_giant')==30
          assert any(e['type']=='slot_repacked' and e['round']==2 and e['side']=='defender'
                     and e['details']['units']==10 for e in result['events'])
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-same-wave-projection.yml
          git commit -m "chore: remove PR37 same-wave validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
