name: P0 Tender Partial Healing Counterfactual Envelope

on:
  push:
    branches:
      - research/p0-tender-partial-heal-allocation-envelope-20261024
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tender-partial-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Target model-vs-counterfactual evidence tests
        run: |
          python -m pytest -q tests/unit/test_p0_tender_partial_heal_allocation_envelope.py tests/unit/test_p0_live_insufficient_support_round2.py tests/unit/test_p0_reserve_rr_healing_continuity.py tests/unit/test_p0_healing_capacity_boundary_audit.py
      - name: Export source-classified hypothetical envelope
        run: |
          PYTHONPATH=. python tools/research/p0_tender_partial_heal_allocation_envelope.py --output-json research-output/p0-tender-partial-healing-envelope.json --output-csv research-output/p0-tender-partial-healing-envelope.csv
      - name: Full regression
        run: python -m pytest -q
      - name: Compile all source
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Archive source and hypothesis evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-tender-partial-healing-envelope-evidence
          path: |
            research-output/p0-tender-partial-healing-envelope.json
            research-output/p0-tender-partial-healing-envelope.csv
          if-no-files-found: error
