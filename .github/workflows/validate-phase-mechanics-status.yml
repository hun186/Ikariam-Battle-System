name: Validate phase engine and mechanics status

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-phase-mechanics-status.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate engine, metadata, UI and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/unit/test_profiles.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          from ikariam_battle import UnitRegistry, simulate
          from ikariam_battle.profiles import TargetingProfile
          from web_simulator import run_battle

          t=TargetingProfile.load()
          assert t.firing_order==('anti-balloon','balloon','third','flank','second','first')
          assert t.formation_fill_order==('balloon','anti-balloon','third','second','first','flank')
          assert t.same_formation_simultaneous is True
          assert t.priorities['third']==('first','flank')

          r=UnitRegistry.load()
          machines={u.id for u in r.all() if u.domain=='land' and u.unit_class=='machine'}
          assert machines=={'steam_giant','battering_ram','catapult','mortar','gyrocopter','bombardier'}
          assert r.get('hoplite').unit_class=='human'
          assert r.get('sulphur_carabineer').unit_class=='human'

          flank_case={
            'policy':'experimental','battlefield':'land-max','max_rounds':1,
            'attacker':{'units':[{'unit_id':'hoplite','quantity':350},
                                 {'unit_id':'swordsman','quantity':240,'attack_upgrade':30}]},
            'defender':{'units':[{'unit_id':'hoplite','quantity':350},
                                 {'unit_id':'sulphur_carabineer','quantity':84}]},
          }
          result=simulate(flank_case)
          assert result['casualties']['defender'].get('sulphur_carabineer')==84
          assert not any(e['type']=='damage' and e['side']=='defender'
                         and e['details'].get('source_unit_id')=='sulphur_carabineer'
                         for e in result['events'])

          artillery_case={
            'policy':'experimental','battlefield':'land-max','max_rounds':1,
            'attacker':{'units':[{'unit_id':'hoplite','quantity':350},
                                 {'unit_id':'swordsman','quantity':240,'attack_upgrade':30}]},
            'defender':{'units':[{'unit_id':'hoplite','quantity':350},
                                 {'unit_id':'sulphur_carabineer','quantity':84},
                                 {'unit_id':'mortar','quantity':30}]},
          }
          result=simulate(artillery_case)
          mortar=[e for e in result['events'] if e['type']=='damage'
                  and e['side']=='defender' and e['details'].get('source_unit_id')=='mortar']
          assert mortar and {e['details']['target_line'] for e in mortar}=={'first'}
          assert sum(e['details']['casualties'] for e in mortar)==30

          metadata=run_battle
          html=Path('index.html').read_text()
          for needle in (
              '戰鬥機制狀態 / Mechanics status',
              'Air defence → Air → Artillery → Flanks → Long-range → Main battle line',
              'P-kill',
              'IR / SR',
              'RR · Reserve Redistribution',
              'Steam Giant、Ram、Catapult、Mortar、Gyrocopter、Bombardier',
          ):
              assert needle in html, needle
          assert html==Path('public/index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ikariam-ui.js').write_text(script)
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-phase-mechanics-status.yml
          git commit -m "chore: remove one-time mechanics validation"
          git push origin HEAD:feat/round-combat-healing-stats
