name: Validate debug JSON downloads

on:
  push:
    branches:
      - feat/debug-json-downloads
    paths:
      - .github/workflows/validate-debug-json-downloads.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/debug-json-downloads
          fetch-depth: 0
      - name: Validate debug exports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              'id="downloadSetupTop" class="secondary" type="button">下載兵力設定 Debug JSON</button>',
              'id="downloadSetup" class="secondary" type="button">下載兵力設定 Debug JSON</button>',
              'id="downloadRoundDebug" class="secondary" type="button">下載本回合 Debug JSON</button>',
              'function scenarioFromSetup(){',
              'function setupDebugPayload(){',
              'function roundDebugPayload(){',
              "debug_format:'ikariam-battle-simulator',debug_version:1,kind:'setup'",
              "debug_format:'ikariam-battle-simulator',debug_version:1,kind:'round'",
              'current_round_events:currentRoundEvents',
              'unsupported_mechanics:unsupportedMechanics',
          )
          for needle in required:
              assert needle in html, needle
          assert "const scenario=scenarioFromSetup(),submittedBattlefield=scenario.battlefield;" in html
          assert html == Path('public/index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-debug-json-downloads.yml
          git commit -m "chore: remove debug export validation"
          git push origin HEAD:feat/debug-json-downloads
