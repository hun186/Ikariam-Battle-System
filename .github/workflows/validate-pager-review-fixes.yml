name: Validate pager review fixes

on:
  push:
    branches:
      - feat/battle-report-ui-calibration
    paths:
      - .github/workflows/validate-pager-review-fixes.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battle-report-ui-calibration
          fetch-depth: 0
      - name: Validate pager fixes and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/integration/test_api.py tests/unit/test_engine.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "currentRoundNumber===0?1:Math.min(maximum,currentRoundNumber+1)" in html
          assert "input.step='1'" in html
          assert "Math.trunc(raw)" in html
          assert "Number.isFinite(raw)" in html
          assert "Math.max(1,Math.min(maximum,Number(input.value)||1))" not in html
          Path('/tmp/ikariam-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pager-review-fixes.yml
          git commit -m "chore: remove pager review validation"
          git push origin HEAD:feat/battle-report-ui-calibration
