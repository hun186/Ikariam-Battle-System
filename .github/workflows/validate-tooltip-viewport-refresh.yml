name: Validate tooltip viewport refresh

on:
  push:
    branches:
      - fix/report-ui-compact-tooltips
    paths:
      - .github/workflows/validate-tooltip-viewport-refresh.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-ui-compact-tooltips
          fetch-depth: 0
      - name: Validate tooltip viewport refresh and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              'function scheduleFloatingTooltipRefresh()',
              'requestAnimationFrame(()=>{',
              "window.addEventListener('scroll',scheduleFloatingTooltipRefresh,true)",
              "window.addEventListener('resize',scheduleFloatingTooltipRefresh)",
              'const trigger=hoveredTooltipTrigger||focusedTooltipTrigger',
          )
          for needle in required:
              assert needle in html, needle
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-tooltip-viewport-refresh.yml
          git commit -m "chore: remove tooltip viewport validation"
          git push origin HEAD:fix/report-ui-compact-tooltips
