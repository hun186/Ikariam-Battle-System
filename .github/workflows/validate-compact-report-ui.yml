name: Validate compact report UI follow-up
# rerun

on:
  push:
    branches:
      - fix/report-ui-compact-tooltips
    paths:
      - .github/workflows/validate-compact-report-ui.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-ui-compact-tooltips
          fetch-depth: 0
      - name: Validate compact report UI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              'id="showUnitIdentity" type="checkbox"',
              '.show-unit-identity .unit-ident-copy',
              '.floating-tooltip{position:fixed',
              'id="floatingTooltip"',
              'function showFloatingTooltip',
              'function hideFloatingTooltip',
              'getBoundingClientRect()',
              'window.innerWidth',
              'window.innerHeight',
              'bindFloatingTooltips(board)',
          )
          for needle in required:
              assert needle in html, needle
          assert "'<strong>'+esc(slot.display_name)+'</strong>" not in html
          assert '.slot:hover .slot-tooltip' not in html
          assert '.reserve-card:hover .slot-tooltip' not in html
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-compact-report-ui.yml
          git commit -m "chore: remove compact report UI validation"
          git push origin HEAD:fix/report-ui-compact-tooltips
