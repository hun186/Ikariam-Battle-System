name: Validate focused tooltip fix

on:
  push:
    branches:
      - fix/report-ui-compact-tooltips
    paths:
      - .github/workflows/validate-focused-tooltip-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-ui-compact-tooltips
          fetch-depth: 0
      - name: Validate tooltip fix and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "const hideIfInactive=()=>{if(document.activeElement!==trigger&&!trigger.matches(':hover'))hideFloatingTooltip()}" in html
          assert "trigger.addEventListener('mouseleave',hideIfInactive)" in html
          assert "trigger.addEventListener('blur',hideIfInactive)" in html
          assert "trigger.addEventListener('mouseleave',hideFloatingTooltip)" not in html
          assert "trigger.addEventListener('blur',hideFloatingTooltip)" not in html
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-focused-tooltip-fix.yml
          git commit -m "chore: remove focused-tooltip validation"
          git push origin HEAD:fix/report-ui-compact-tooltips
