name: Validate PR37 arrival aggregation

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-arrival-aggregation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate final review fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.engine import simulate
          result=simulate({
              'policy':'experimental','battlefield':'land-mini','max_rounds':1,
              'attacker':{'units':[
                  {'unit_id':'hoplite','quantity':90,'entry_batch_id':'a0','arrival_round':0},
                  {'unit_id':'doctor','quantity':10,'entry_batch_id':'a1','wave_id':'doctor-a','arrival_round':1},
                  {'unit_id':'doctor','quantity':20,'entry_batch_id':'a1','wave_id':'doctor-b','arrival_round':1},
              ]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90}]},
          })
          arrival=next(e for e in result['events']
                       if e['type']=='entry_batch_arrived'
                       and e['side']=='attacker'
                       and e['details']['entry_batch_id']=='a1')
          assert arrival['details']['units']=={'doctor':30}
          assert result['final_state']['attacker']['deployed_support']['doctor']==30
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-arrival-aggregation.yml
          git commit -m "chore: remove PR37 arrival validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
