name: Validate cross-trigger tooltip fix

on:
  push:
    branches:
      - fix/report-ui-compact-tooltips
    paths:
      - .github/workflows/validate-cross-trigger-tooltip.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-ui-compact-tooltips
          fetch-depth: 0
      - name: Validate cross-trigger tooltip and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              'let hoveredTooltipTrigger=null,focusedTooltipTrigger=null',
              'function refreshFloatingTooltip()',
              'const trigger=hoveredTooltipTrigger||focusedTooltipTrigger',
              "trigger.addEventListener('mouseenter',()=>{hoveredTooltipTrigger=trigger;refreshFloatingTooltip()})",
              "trigger.addEventListener('mouseleave',()=>{if(hoveredTooltipTrigger===trigger)hoveredTooltipTrigger=null;refreshFloatingTooltip()})",
              "trigger.addEventListener('focus',()=>{focusedTooltipTrigger=trigger;refreshFloatingTooltip()})",
              "trigger.addEventListener('blur',()=>{if(focusedTooltipTrigger===trigger)focusedTooltipTrigger=null;refreshFloatingTooltip()})",
              'function resetFloatingTooltipState()',
              'resetFloatingTooltipState();',
          )
          for needle in required:
              assert needle in html, needle
          assert 'hideIfInactive' not in html
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-cross-trigger-tooltip.yml
          git commit -m "chore: remove cross-trigger tooltip validation"
          git push origin HEAD:fix/report-ui-compact-tooltips
