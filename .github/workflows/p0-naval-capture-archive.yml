name: P0 Naval Unverified Capture Archive

on:
  push:
    branches:
      - research/p0-naval-capture-archive-general-fleet-20261025
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-capture-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Archive boundary and preceding intake regression
        run: |
          python -m pytest -q tests/unit/test_p0_naval_capture_archive.py tests/unit/test_p0_gameforge_naval_capture_intake.py tests/unit/test_p0_naval_hp_bar_capture_discrimination.py tests/unit/test_p0_naval_stage_pair_deltas.py
      - name: Generate EMPTY capture template only
        run: |
          PYTHONPATH=. python tools/research/p0_naval_capture_archive.py --write-template research-output/p0-naval-archive-EMPTY-TEMPLATE.json
      - name: Full regression
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Publish empty-source template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-naval-unverified-archive-empty-template
          path: research-output/p0-naval-archive-EMPTY-TEMPLATE.json
          if-no-files-found: error
