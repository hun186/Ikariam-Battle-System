name: Validate mechanics and PDF tabs
# rerun after updating legacy static assertions

on:
  push:
    branches:
      - feat/mechanics-and-pdf-tabs
    paths:
      - .github/workflows/validate-mechanics-pdf-tabs.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mechanics-and-pdf-tabs
          fetch-depth: 0
      - name: Validate mechanics/source tabs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for needle in (
              'data-view="mechanics">戰鬥機制</button>',
              'data-view="source">Battle System PDF</button>',
              'id="mechanicsView" class="hidden"',
              'id="sourceView" class="hidden"',
              'https://forum.ikariam.gameforge.com/forum/thread/43268-ikariam-battle-system/',
              'href="/ikariam-battle-system.pdf"',
              'PDF 署名：AT Barbarossa, Xanto · July 16, 2020',
          ):
              assert needle in html, needle
          assert '<details class="mechanics-reference panel">' not in html
          assert Path('ikariam-battle-system.pdf').read_bytes()[:4] == b'%PDF'
          assert Path('public/ikariam-battle-system.pdf').read_bytes()[:4] == b'%PDF'
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mechanics-pdf-tabs.yml
          git commit -m "chore: remove mechanics/PDF validation"
          git push origin HEAD:feat/mechanics-and-pdf-tabs
