name: P0 Live Round2 HP Casualty Ledger

on:
  push:
    branches:
      - research/p0-live-round2-prefire-postfire-ledger-20261024
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-two-round-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused real two-round and prior support tests
        run: |
          python -m pytest -q tests/unit/test_p0_live_round2_prefire_postfire_ledger.py tests/unit/test_p0_reserve_rr_healing_continuity.py tests/unit/test_p0_land_doctor_multiround.py tests/unit/test_naval_tender_multiround_experimental.py
      - name: Export classified R1 R2 prefire and postfire evidence
        run: |
          PYTHONPATH=. python tools/research/p0_live_round2_prefire_postfire_ledger.py --output-json research-output/p0-live-two-round-ledger.json --output-csv research-output/p0-live-two-round-ledger.csv
      - name: Full regression suite
        run: python -m pytest -q
      - name: Compile Python code
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Upload source classified JSON and CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-live-round2-hp-casualty-ledger-evidence
          path: |
            research-output/p0-live-two-round-ledger.json
            research-output/p0-live-two-round-ledger.csv
          if-no-files-found: error
