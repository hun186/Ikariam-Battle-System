name: Validate PR32 after main sync

on:
  push:
    branches:
      - fix/report-ui-compact-tooltips
    paths:
      - .github/workflows/validate-pr32-main-sync.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-ui-compact-tooltips
          fetch-depth: 0
      - name: Validate synced PR32
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              'id="showUnitIdentity"',
              'class="unit-ident-copy"',
              'id="floatingTooltip"',
              'function showFloatingTooltip',
              'function hideFloatingTooltip',
              'function scheduleFloatingTooltipRefresh()',
              "window.addEventListener('scroll',scheduleFloatingTooltipRefresh,true)",
              "window.addEventListener('resize',scheduleFloatingTooltipRefresh)",
          )
          for needle in required:
              assert needle in html, needle
          tests=Path('tests/unit/test_engine.py').read_text()
          for needle in (
              'test_destroyed_slot_identity_is_round_local_not_a_persistent_tombstone',
              'test_round_start_refill_replaces_destroyed_marker_with_live_current_state',
              'test_partial_flank_casualties_reduce_later_long_range_shots',
              'test_sequential_volley_resolution_differs_from_legacy_pooled_casualty_math',
              'test_ir_and_sr_hooks_are_explicitly_disabled_at_baseline',
              'test_round_redistribution_keeps_entry_waves_isolated',
          ):
              assert tests.count(needle)==1, needle
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr32-main-sync.yml
          git commit -m "chore: remove PR32 main-sync validation"
          git push origin HEAD:fix/report-ui-compact-tooltips
