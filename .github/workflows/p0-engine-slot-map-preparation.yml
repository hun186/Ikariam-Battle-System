name: P0 Real Engine Slot Map Preparation

on:
  push:
    branches:
      - feat/research-engine-slot-map-preparation-20261030
  pull_request:
    branches:
      - main
    paths:
      - tools/research/p0_report_case_engine_slot_map_draft.py
      - tests/unit/test_p0_report_case_engine_slot_map_draft.py
      - docs/calibration/p0-report-case-engine-slot-map-preparation.md
      - .github/workflows/p0-engine-slot-map-preparation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-engine-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Real engine preparation regressions
        run: |
          python -m pytest -q tests/unit/test_p0_report_case_engine_slot_map_draft.py tests/unit/test_p0_report_case_real_engine_trace.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Compile all Python
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
