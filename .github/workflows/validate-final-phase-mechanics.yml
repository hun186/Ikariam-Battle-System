name: Validate final phase mechanics head

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-final-phase-mechanics.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate final hosted head
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/unit/test_profiles.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          from ikariam_battle import UnitRegistry, simulate
          from ikariam_battle.profiles import TargetingProfile

          t=TargetingProfile.load()
          assert t.firing_order==('anti-balloon','balloon','third','flank','second','first')
          assert t.priorities['third']==('first','flank')
          assert t.same_formation_simultaneous is True

          r=UnitRegistry.load()
          assert {u.id for u in r.all() if u.domain=='land' and u.unit_class=='machine'} == {
              'steam_giant','battering_ram','catapult','mortar','gyrocopter','bombardier'
          }

          s={'policy':'experimental','battlefield':'land-max','max_rounds':1,
             'attacker':{'units':[{'unit_id':'hoplite','quantity':350},
                                  {'unit_id':'swordsman','quantity':240,'attack_upgrade':30}]},
             'defender':{'units':[{'unit_id':'hoplite','quantity':350},
                                  {'unit_id':'sulphur_carabineer','quantity':84},
                                  {'unit_id':'mortar','quantity':30}]}}
          result=simulate(s)
          mortar=[e for e in result['events'] if e['type']=='damage' and e['side']=='defender'
                  and e['details'].get('source_unit_id')=='mortar']
          assert mortar and {e['details']['target_line'] for e in mortar}=={'first'}
          assert sum(e['details']['casualties'] for e in mortar)==30
          assert not any(e['type']=='damage' and e['side']=='defender'
                         and e['details'].get('source_unit_id')=='sulphur_carabineer'
                         for e in result['events'])

          html=Path('index.html').read_text()
          for needle in ('戰鬥機制狀態 / Mechanics status','P-kill','IR / SR',
                         'Air defence → Air → Artillery → Flanks → Long-range → Main battle line'):
              assert needle in html
          assert html==Path('public/index.html').read_text()
          Path('/tmp/ikariam-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-final-phase-mechanics.yml
          git commit -m "chore: remove final phase-mechanics validation"
          git push origin HEAD:feat/round-combat-healing-stats
