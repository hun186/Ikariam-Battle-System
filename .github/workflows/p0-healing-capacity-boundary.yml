name: P0 Healing Capacity Boundary Audit

on:
  push:
    branches:
      - research/p0-healing-capacity-boundary-20261023
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healing-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused Round2 capacity and existing multiround regression
        run: |
          python -m pytest -q tests/unit/test_p0_healing_capacity_boundary_audit.py tests/unit/test_p0_land_doctor_multiround.py tests/unit/test_naval_tender_multiround_experimental.py tests/unit/test_p0_low_hp_hp_ledger.py
      - name: Export classified seeded boundary report
        run: |
          PYTHONPATH=. python tools/research/p0_healing_capacity_boundary_audit.py --output-json research-output/p0_healing_capacity_boundary.json --output-csv research-output/p0_healing_capacity_boundary.csv
      - name: Full regression suite
        run: python -m pytest -q
      - name: Compile source packages
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Upload provenance and state evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-healing-capacity-boundary-evidence
          path: |
            research-output/p0_healing_capacity_boundary.json
            research-output/p0_healing_capacity_boundary.csv
          if-no-files-found: error
