name: Validate explicit 1000-round cap

on:
  push:
    branches:
      - feat/round-safety-cap-1000
    paths:
      - .github/workflows/validate-round-cap-default.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-safety-cap-1000
          fetch-depth: 0
      - name: Validate default response size and explicit cap
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_models.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          grep -q 'max="1000" value="100"' index.html
          python - <<'PY'
          import json
          from time import perf_counter
          from ikariam_battle import simulate

          base={
              'policy':'experimental',
              'battlefield':'land-max',
              'attacker':{'units':[{'unit_id':'hoplite','quantity':10_000_000}]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':10_000_000}]},
          }

          started=perf_counter()
          default_result=simulate(base)
          default_elapsed=perf_counter()-started
          default_bytes=len(json.dumps(default_result,separators=(',',':')).encode())

          explicit={**base,'max_rounds':1000}
          started=perf_counter()
          explicit_result=simulate(explicit)
          explicit_elapsed=perf_counter()-started
          explicit_bytes=len(json.dumps(explicit_result,separators=(',',':')).encode())

          print(
              'ROUND_CAP_RESPONSE_BENCHMARK '
              f'default_rounds={default_result["rounds_completed"]} '
              f'default_bytes={default_bytes} default_sec={default_elapsed:.3f} '
              f'explicit_rounds={explicit_result["rounds_completed"]} '
              f'explicit_bytes={explicit_bytes} explicit_sec={explicit_elapsed:.3f}'
          )

          assert default_result['rounds_completed']==100
          assert explicit_result['rounds_completed']==1000
          assert default_bytes < 3_000_000
          assert default_bytes * 5 < explicit_bytes
          assert [e for e in default_result['events'] if e['type']=='safety_limit_reached'][0]['details']['limit']==100
          assert [e for e in explicit_result['events'] if e['type']=='safety_limit_reached'][0]['details']['limit']==1000
          PY
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-round-cap-default.yml
          git commit -m "chore: remove one-time round-default validation"
          git push origin HEAD:feat/round-safety-cap-1000
