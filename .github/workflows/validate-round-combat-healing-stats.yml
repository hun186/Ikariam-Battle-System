name: Validate round combat healing stats

on:
  push:
    branches:
      - feat/round-combat-healing-stats
    paths:
      - .github/workflows/validate-round-combat-healing-stats.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-combat-healing-stats
          fetch-depth: 0
      - name: Validate round damage and evidence-safe healing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          python -m pytest -q tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          from ikariam_battle import simulate
          from web_simulator import run_battle

          base={
              'policy':'experimental',
              'battlefield':'land-mini',
              'max_rounds':5,
              'attacker':{'units':[{'unit_id':'hoplite','quantity':90}]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90}]},
          }
          result=simulate(base)
          for row in result['rounds']:
              stats=row['combat_statistics']
              assert stats['attacker']['damage_dealt']==stats['defender']['damage_taken']
              assert stats['defender']['damage_dealt']==stats['attacker']['damage_taken']
              assert stats['attacker']['healing']==0
              assert stats['defender']['healing']==0
          final=result['rounds'][-1]['combat_statistics']
          for side in ('attacker','defender'):
              assert final[side]['cumulative_damage_dealt']==result['combat_statistics'][side]['gross_damage_dealt']
              assert final[side]['cumulative_damage_taken']==result['combat_statistics'][side]['gross_damage_taken']
              assert result['combat_statistics'][side]['gross_healing']==0

          doctor={**base,'attacker':{'units':[
              {'unit_id':'hoplite','quantity':90},
              {'unit_id':'doctor','quantity':2},
          ]}}
          treated=simulate(doctor)
          hs=treated['healing_status']
          assert hs['modeled'] is False
          assert hs['derived_capacity_per_doctor']==4000
          assert hs['capacity_is_allocation_formula'] is False
          assert hs['sides']['attacker']['status']=='ignored_by_named_assumption'
          assert hs['sides']['attacker']['healing_amount'] is None
          assert treated['combat_statistics']['attacker']['gross_healing'] is None
          assert all(r['combat_statistics']['attacker']['healing'] is None for r in treated['rounds'])
          assert all(r['combat_statistics']['attacker']['cumulative_healing'] is None for r in treated['rounds'])

          summary=run_battle({**doctor,'report':{'mode':'summary'}})
          assert summary['rounds']==[]
          assert summary['healing_status']==treated['healing_status']
          page=run_battle({**doctor,'report':{'mode':'round_page','round_start':0,'round_limit':10}})
          assert page['rounds']
          assert all('combat_statistics' in row for row in page['rounds'])
          assert all(row['combat_statistics']['attacker']['healing'] is None for row in page['rounds'])

          html=Path('index.html').read_text()
          for needle in (
              '治療支援（尚未建模）',
              'Healing / 治療尚未建模',
              '攻擊方造成傷害',
              '攻擊方承受傷害',
              '攻擊方治療',
              'Gross damage taken',
              'Doctor / 治療',
              'derived capacity reference',
          ):
              assert needle in html, needle
          assert html==Path('public/index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ikariam-ui.js').write_text(script)
          PY
          node --check /tmp/ikariam-ui.js
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-round-combat-healing-stats.yml
          git commit -m "chore: remove one-time combat-healing validation"
          git push origin HEAD:feat/round-combat-healing-stats
