name: P0 Live R2 Insufficient Healing Evidence

on:
  push:
    branches:
      - research/p0-live-insufficient-heal-r2-ledger-20261024
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-insufficient-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Live R2 partial unknown and previous support tests
        run: |
          python -m pytest -q tests/unit/test_p0_live_insufficient_support_round2.py tests/unit/test_p0_healing_capacity_boundary_audit.py tests/unit/test_p0_reserve_rr_healing_continuity.py tests/unit/test_p0_live_round2_prefire_postfire_ledger.py
      - name: Emit model-only R1 R2 evidence
        run: |
          PYTHONPATH=. python tools/research/p0_live_insufficient_support_round2.py --output-json research-output/p0-live-insufficient-heal-r2.json --output-csv research-output/p0-live-insufficient-heal-r2.csv
      - name: Full regression
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Archive provenance-classified JSON CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-live-insufficient-heal-r2-evidence
          path: |
            research-output/p0-live-insufficient-heal-r2.json
            research-output/p0-live-insufficient-heal-r2.csv
          if-no-files-found: error
