name: P0 Naval Slot HP Falsification

on:
  push:
    branches:
      - research/p0-naval-slot-hp-falsification-20261023
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naval-slot-hp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused model evidence and adversarial tests
        run: |
          python -m pytest -q tests/unit/test_p0_naval_slot_hp_falsification.py tests/unit/test_naval_air_counterpart_probe.py tests/unit/test_p0_naval_observed_vs_model.py
      - name: Export JSON/CSV source-tagged trace
        run: |
          PYTHONPATH=. python tools/research/p0_naval_slot_hp_falsification.py --output-json research-output/p0_naval_slot_hp_falsification.json --output-csv research-output/p0_naval_slot_hp_falsification.csv
      - name: Full suite
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Upload research outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-naval-slot-hp-falsification
          path: |
            research-output/p0_naval_slot_hp_falsification.json
            research-output/p0_naval_slot_hp_falsification.csv
          if-no-files-found: error
