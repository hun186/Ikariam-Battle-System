name: Materialize Ikariam naval icons

on:
  push:
    branches:
      - feat/naval-barbarian-catalog
    paths:
      - .github/workflows/materialize-naval-barbarian-icons.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naval-barbarian-catalog
          fetch-depth: 0

      - name: Download fixed Ikariam naval icon URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/unit-icons/naval public/assets/unit-icons/naval

          naval=(
            "steam_ram:STEAM_RAM.webp"
            "fire_ship:FIRE_SHIP.webp"
            "ram_ship:RAM_SHIP.webp"
            "ballista_ship:BALLISTA_SHIP.webp"
            "catapult_ship:CATAPULT_SHIP.webp"
            "mortar_ship:MORTAR_SHIP.webp"
            "diving_boat:DIVING_BOAT.webp"
            "rocket_ship:ROCKET_SHIP.webp"
            "balloon_carrier:BALLOON_CARRIER.webp"
            "paddle_speedboat:PADDLE_SPEEDBOAT.webp"
            "tender:TENDER.webp"
          )

          validate_png() {
            python - "$1" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          d = p.read_bytes()
          assert len(d) >= 24, f"{p}: too small"
          assert d[:8] == b"\x89PNG\r\n\x1a\n", f"{p}: not PNG"
          PY
          }

          for item in "${naval[@]}"; do
            unit="${item%%:*}"
            remote="${item#*:}"
            dest="assets/unit-icons/naval/${unit}.png"
            proxy="https://images.weserv.nl/?url=ika-sim.com/units/${remote}&output=png"
            echo "naval: ${unit}"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 45 --silent --show-error "${proxy}" -o "${dest}"
            validate_png "${dest}"
            cp "${dest}" "public/${dest}"
          done

          {
            echo "# Naval icon provenance"
            echo
            echo "Retrieved on 2026-09-26 from the fixed Ikariam Battle Simulator unit URLs through images.weserv.nl as a transfer proxy. Runtime code must use only the committed local files. The repository does not claim ownership of the artwork."
            echo
            echo "| Unit | Canonical source | Local path | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for item in "${naval[@]}"; do
              unit="${item%%:*}"; remote="${item#*:}"; p="assets/unit-icons/naval/${unit}.png"
              sha="$(sha256sum "${p}" | awk '{print $1}')"
              echo "| ${unit} | https://ika-sim.com/units/${remote} | ${p} | \`${sha}\` |"
            done
          } > docs/naval-icon-provenance.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unit-icons/naval public/assets/unit-icons/naval docs/naval-icon-provenance.md
          git rm .github/workflows/materialize-naval-barbarian-icons.yml
          git commit -m "feat: add local Ikariam naval unit icons"
          git push origin HEAD:feat/naval-barbarian-catalog
