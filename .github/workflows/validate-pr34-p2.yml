name: Validate PR34 P2 fix
# rerun after updating the legacy static error assertion

on:
  push:
    branches:
      - fix/center-first-round-rebuild
    paths:
      - .github/workflows/validate-pr34-p2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-first-round-rebuild
          fetch-depth: 0
      - name: Validate PR34 P2 fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for needle in (
              'id="errorTop" class="error" aria-hidden="true"',
              'id="error" class="error" role="alert"',
              'function setSimulationError(message)',
              'errorTop.textContent=value;',
              'error.textContent=value;',
              "simulateTop.addEventListener('click',runSimulation)",
              "simulate.addEventListener('click',runSimulation)",
          ):
              assert needle in html, needle
          assert html.count('role="alert"') == 1
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr34-p2.yml
          git commit -m "chore: remove PR34 P2 validation"
          git push origin HEAD:fix/center-first-round-rebuild
