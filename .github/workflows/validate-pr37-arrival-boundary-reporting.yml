name: Validate PR37 arrival boundary reporting

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-pr37-arrival-boundary-reporting.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate arrival boundary reporting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from ikariam_battle.engine import simulate
          from web_simulator import run_battle

          scenario={
              'policy':'experimental','battlefield':'land-mini','max_rounds':3,
              'attacker':{'units':[{'unit_id':'hoplite','quantity':90,'entry_batch_id':'a3','arrival_round':3}]},
              'defender':{'units':[{'unit_id':'hoplite','quantity':90,'entry_batch_id':'d3','arrival_round':3}]},
          }
          full=simulate(scenario)
          assert full['rounds_completed']==3
          round3=next(row for row in full['rounds'] if row['round']==3)
          assert round3['casualties']=={'attacker':{},'defender':{}}
          assert round3['attacker']['reserve']['hoplite']==90
          assert round3['defender']['reserve']['hoplite']==90

          page=run_battle({**scenario,'report':{'mode':'round_page','round_start':3,'round_limit':1}})
          assert page['rounds_completed']==3
          assert [row['round'] for row in page['rounds']]==[3]
          assert any(e['type']=='entry_batch_arrived' and e['round']==3 for e in page['events'])
          assert any(e['type']=='unsupported_mechanic' and e['round']==3
                     and e['details'].get('rule_id')=='UNKNOWN-CROSS-WAVE-FORMATION-REBUILD'
                     for e in page['events'])
          PY
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-pr37-arrival-boundary-reporting.yml
          git commit -m "chore: remove PR37 arrival-boundary validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
