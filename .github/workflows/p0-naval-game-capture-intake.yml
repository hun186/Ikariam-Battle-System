name: P0 Naval Game Screenshot Capture Intake

on:
  push:
    branches:
      - research/p0-gameforge-r1-r2-capture-intake-20261024
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Targeted capture and original model uncertainty tests
        run: |
          python -m pytest -q tests/unit/test_p0_gameforge_naval_capture_intake.py tests/unit/test_p0_naval_hp_bar_capture_discrimination.py tests/unit/test_p0_tender_healing_rr_order_uncertainty.py tests/unit/test_p0_tender_partial_heal_allocation_envelope.py
      - name: Emit only a BLANK template
        run: |
          PYTHONPATH=. python tools/research/p0_gameforge_naval_capture_intake.py --write-template research-output/p0-real-game-capture-EMPTY-TEMPLATE.json
      - name: Full suite
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q ikariam_battle tools asgi.py web_simulator.py simulator.py
      - name: Archive blank intake template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-naval-real-game-capture-empty-template-only
          path: research-output/p0-real-game-capture-EMPTY-TEMPLATE.json
          if-no-files-found: error
