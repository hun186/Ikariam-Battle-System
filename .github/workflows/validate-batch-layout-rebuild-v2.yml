name: Validate batch model layout and deferred rebuild v2

on:
  push:
    branches:
      - fix/setup-batches-layout-and-deferred-rebuild
    paths:
      - .github/workflows/validate-batch-layout-rebuild-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-batches-layout-and-deferred-rebuild
          fetch-depth: 0
      - name: Validate final branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/unit/test_models.py tests/unit/test_formation.py tests/unit/test_engine.py tests/integration/test_api.py
          python -m pytest -q
          python -m compileall -q ikariam_battle asgi.py web_simulator.py simulator.py
          cmp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=(
              "batchId=options.batchId||side+'-batch-'+batchIndex",
              'class="entry-batch"',
              'class="arrival-round"',
              "wave_id:entryBatchId+'::'+row.dataset.unitId",
              '.unit-statbox{display:none;grid-column:2/-1',
              '.advanced{grid-column:2/-1;margin:0}',
              '.unit-ident,.qty-control,.unit-statbox,.advanced{grid-column:1/-1}',
          )
          for needle in required:
              assert needle in html, needle
          Path('/tmp/ikariam-inline.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ikariam-inline.js
          git diff --check origin/main...HEAD
      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-batch-layout-rebuild-v2.yml
          git commit -m "chore: remove final batch/layout validation"
          git push origin HEAD:fix/setup-batches-layout-and-deferred-rebuild
