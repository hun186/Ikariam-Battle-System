[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "ikariam-battle-system"
version = "0.2.0"
description = "Evidence-aware, deterministic Ikariam battle simulation engine"
requires-python = ">=3.11"

[tool.vercel]
entrypoint = "web_simulator:handler"

[tool.setuptools]
py-modules = ["web_simulator", "asgi", "simulator"]

[tool.setuptools.packages.find]
include = ["api*", "ikariam_battle*"]
exclude = ["public*", "tests*"]

[tool.setuptools.package-data]
"ikariam_battle.data.units" = ["*.json"]
"ikariam_battle.data.rules" = ["*.json"]
"ikariam_battle.data.mechanics" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
