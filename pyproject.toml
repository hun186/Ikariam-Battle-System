[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ikariam-battle-system"
version = "0.1.0"
description = "Ikariam battle simulator with Vercel deploy target"
requires-python = ">=3.11"

[tool.vercel]
entrypoint = "web_simulator:handler"

[tool.setuptools]
py-modules = ["web_simulator", "asgi", "simulator", "pdf_extract"]

[tool.setuptools.packages.find]
include = ["api*"]
exclude = ["public*"]
