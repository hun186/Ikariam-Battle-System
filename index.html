<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ikariam Battle Simulator — Evidence-aware Phase A</title>
<style>
:root{--ink:#17243a;--paper:#f4efe2;--navy:#142b4a;--gold:#c99a3d;--red:#963f35;--card:#fffdf7;--line:#d7c8aa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif;background:linear-gradient(#dce5e9 0 190px,var(--paper) 190px)}header{height:190px;padding:34px max(24px,calc((100% - 1180px)/2));color:white;background:linear-gradient(115deg,rgba(10,30,55,.97),rgba(27,70,92,.88));border-bottom:5px solid var(--gold)}h1{font:700 clamp(28px,4vw,48px) Georgia,serif;margin:0 0 8px}header p{max-width:730px;margin:0;color:#dce8ec}.tag{display:inline-block;margin-top:16px;padding:5px 10px;background:#ffffff18;border:1px solid #ffffff55;border-radius:20px;font-size:12px}main{max-width:1180px;margin:28px auto;padding:0 20px 50px}.settings,.army,.result,.round{background:var(--card);border:1px solid var(--line);box-shadow:0 3px 14px #21334813;border-radius:8px}.settings{display:flex;gap:18px;align-items:end;padding:16px;margin-bottom:18px;flex-wrap:wrap}label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:grid;gap:5px}select,input{border:1px solid #b8aa8d;border-radius:4px;padding:9px;background:white;color:var(--ink)}.armies{display:grid;grid-template-columns:1fr 1fr;gap:18px}.army{padding:18px}.army h2{font:700 25px Georgia,serif;margin:0 0 12px;border-bottom:2px solid var(--gold);padding-bottom:8px}.unit-row{display:grid;grid-template-columns:2fr .8fr .8fr .8fr auto;gap:7px;margin:8px 0;align-items:end}.unit-row label{font-size:10px}.btn{border:0;border-radius:4px;padding:10px 15px;background:var(--navy);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#667480}.btn.remove{background:var(--red);padding:9px 12px}.actions{text-align:center;margin:22px}.actions .btn{font-size:17px;padding:13px 34px;background:var(--red)}#error{color:var(--red);font-weight:700}.result{padding:20px;margin-top:20px}.result h2{margin-top:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:12px;background:#edf1ef;border-left:3px solid var(--gold)}.metric b{display:block;font-size:21px}.notice{padding:10px 12px;background:#fff3d5;border-left:4px solid var(--gold);margin:10px 0}.round{padding:16px;margin:12px 0}.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slots{display:flex;flex-wrap:wrap;gap:6px}.slot{min-width:105px;border:1px solid var(--line);padding:7px;background:#f7f2e8}.slot b{display:block}.events{font:12px ui-monospace,monospace;max-height:180px;overflow:auto;background:#17243a;color:#e9efe9;padding:10px}small{color:#667}@media(max-width:800px){.armies,.sides{grid-template-columns:1fr}.unit-row{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>Ikariam Battle Simulator</h1><p>A deterministic, evidence-aware Phase A simulator. Documented rules are separated from experimental assumptions; inconclusive is an honest result.</p><span class="tag">paper-2020 empirical ruleset · Function A MVP</span></header><main>
<section class="settings"><label>Ruleset<select id="ruleset"><option>paper-2020</option></select></label><label>Policy<select id="policy"><option value="strict">Strict / documented</option><option value="experimental">Experimental / best-effort</option></select></label><label>Battlefield<select id="battlefield"><option>small-land</option></select></label><label>Max rounds<input id="maxRounds" type="number" min="1" max="100" value="10"></label><label><span>Attacker</span><span><input id="aHep" type="checkbox"> Hephaistos lv. 5</span></label><label><span>Defender</span><span><input id="dHep" type="checkbox"> Hephaistos lv. 5</span></label></section>
<div class="armies"><section class="army"><h2>Attacker</h2><div id="attacker"></div><button class="btn secondary" data-add="attacker">+ Add unit</button></section><section class="army"><h2>Defender</h2><div id="defender"></div><button class="btn secondary" data-add="defender">+ Add unit</button></section></div>
<div class="actions"><button id="simulate" class="btn">Simulate battle</button><p id="error"></p></div><section id="output"></section>
</main><template id="unitTemplate"><div class="unit-row"><label>Unit<select class="unit"></select></label><label>Quantity<input class="qty" type="number" min="1" value="30"></label><label>Attack +<input class="attack" type="number" min="0" max="3" value="0"></label><label>Armor +<input class="defense" type="number" min="0" max="3" value="0"></label><button class="btn remove" aria-label="Remove">×</button></div></template>
<script>
const units=[['sulphur_carabineer','Sulphur Carabineer'],['hoplite','Hoplite'],['swordsman','Swordsman'],['barbarian_knifeman','Barbarian Knifeman'],['rocket_ship','Rocket Ship'],['steam_ram','Steam Ram']];
function add(side,chosen){const row=document.querySelector('#unitTemplate').content.firstElementChild.cloneNode(true),sel=row.querySelector('.unit'); units.forEach(([v,n])=>sel.add(new Option(n,v)));if(chosen)sel.value=chosen;row.querySelector('.remove').onclick=()=>row.remove();document.querySelector('#'+side).append(row)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));add('attacker','sulphur_carabineer');add('defender','hoplite');
function army(side){return {units:[...document.querySelectorAll('#'+side+' .unit-row')].map(r=>({unit_id:r.querySelector('.unit').value,quantity:+r.querySelector('.qty').value,attack_upgrade:+r.querySelector('.attack').value,defense_upgrade:+r.querySelector('.defense').value}))}}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function side(state){return `<p><b>${state.total}</b> alive · reserve ${Object.values(state.reserve).reduce((a,b)=>a+b,0)}</p><div class="slots">${state.slots.map(s=>`<div class="slot"><b>Slot ${s.slot}</b>${esc(s.unit_id)} × ${s.units}<br><small>${s.damage} damage</small></div>`).join('')||'<small>No deployed units</small>'}</div>`}
function render(d){const assumptions=[...d.assumptions,...d.warnings];document.querySelector('#output').innerHTML=`<section class="result"><h2>${esc(d.outcome.toUpperCase())}</h2><div class="metrics"><div class="metric">Status<b>${esc(d.status)}</b></div><div class="metric">Rounds<b>${d.rounds_completed}</b></div><div class="metric">Attacker alive<b>${d.final_state.attacker.total}</b></div><div class="metric">Defender alive<b>${d.final_state.defender.total}</b></div></div>${assumptions.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}<h3>Round-by-round</h3>${d.rounds.map(r=>{const ev=d.events.filter(e=>e.round===r.round);return `<article class="round"><h3>Round ${r.round}</h3><div class="sides"><div><h4>Attacker</h4>${side(r.attacker)}<small>Casualties: ${esc(JSON.stringify(r.casualties.attacker))}</small></div><div><h4>Defender</h4>${side(r.defender)}<small>Casualties: ${esc(JSON.stringify(r.casualties.defender))}</small></div></div><details><summary>${ev.length} engine events</summary><div class="events">${ev.map(e=>esc(`${e.phase} · ${e.type} · ${JSON.stringify(e.details)}`)).join('<br>')}</div></details></article>`}).join('')}</section>`}
document.querySelector('#simulate').onclick=async()=>{const error=document.querySelector('#error');error.textContent='';try{const body={ruleset:ruleset.value,policy:policy.value,battlefield:battlefield.value,max_rounds:+maxRounds.value,effects:{attacker_hephaistos:aHep.checked,defender_hephaistos:dHep.checked},attacker:army('attacker'),defender:army('defender')};const res=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');render(data)}catch(e){error.textContent=e.message}};
</script></body></html>
